# Vertex 1.0 — déploiement cloud d'analyse, sans TWS/IB Gateway.
services:
  - type: web
    name: trading-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn vertex.runtime:app --worker-class gthread --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: NO_IBKR
        value: "1"
      - key: DEMO
        value: "1"
      - key: START_ON_IMPORT
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.4"
      # ANTHROPIC_API_KEY est optionnelle et doit être configurée comme secret.
